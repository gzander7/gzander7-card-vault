# Supabase CLI configuration for local development and CI.
# Only settings this project relies on are listed; everything else uses the
# CLI's defaults, so new CLI releases don't break on renamed sections.
# The hosted project's settings are managed in its dashboard; the auth values
# below mirror what docs/setup.md asks you to set there.
project_id = "card-vault"

[api]
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = false

[auth]
site_url = "https://gzander7.github.io/gzander7-card-vault/"
additional_redirect_urls = [
  "https://gzander7.github.io/gzander7-card-vault/**",
  "http://localhost:4173/**",
  "http://127.0.0.1:4173/**",
]
enable_signup = false

[auth.email]
enable_signup = false

# Called by pg_cron with a shared secret, not a user JWT. See docs/nightly-valuations.md.
[functions.nightly-valuations]
verify_jwt = false

# The owner endpoint validates the caller's access token with Auth.getUser.
[functions.ebay-sold-comps]
verify_jwt = false
